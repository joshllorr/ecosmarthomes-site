<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a86b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="#f9f9f9"/>
  
  <!-- Roadmap path -->
  <path d="M 30 150 Q 75 100 120 120 T 210 80" stroke="url(#grad6)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Start marker -->
  <circle cx="30" cy="150" r="15" fill="#003f2d"/>
  <text x="30" y="155" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">🏠</text>
  
  <!-- Step 1 -->
  <circle cx="75" cy="100" r="12" fill="#00a86b"/>
  <text x="75" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">1</text>
  
  <!-- Step 2 -->
  <circle cx="120" cy="120" r="12" fill="#00a86b"/>
  <text x="120" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">2</text>
  
  <!-- Step 3 -->
  <circle cx="165" cy="85" r="12" fill="#00a86b"/>
  <text x="165" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">3</text>
  
  <!-- Goal marker -->
  <circle cx="210" cy="80" r="15" fill="#003f2d"/>
  <text x="210" y="87" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">⭐</text>
  
  <!-- Labels -->
  <text x="75" y="40" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#003f2d" font-weight="bold">Assess</text>
  <text x="120" y="55" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#003f2d" font-weight="bold">Plan</text>
  <text x="165" y="40" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#003f2d" font-weight="bold">Improve</text>
  <text x="210" y="35" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#003f2d" font-weight="bold">Success</text>
</svg>
