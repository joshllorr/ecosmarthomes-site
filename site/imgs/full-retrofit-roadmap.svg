<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="roadmapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#roadmapGrad)"/>
  
  <!-- Title -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#003f2d">FULL RETROFIT ROADMAP</text>
  
  <!-- Timeline line with steps -->
  <line x1="60" y1="100" x2="540" y2="100" stroke="#003f2d" stroke-width="3"/>
  <polygon points="540,100 555,95 555,105" fill="#003f2d"/>
  
  <!-- Step 1 -->
  <circle cx="120" cy="100" r="25" fill="#003f2d"/>
  <text x="120" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Step 1</text>
  <text x="120" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#003f2d">BER</text>
  <text x="120" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#003f2d">targets</text>
  
  <!-- Step 2 -->
  <circle cx="240" cy="100" r="25" fill="#003f2d"/>
  <text x="240" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Step 2</text>
  <text x="240" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#003f2d">Grant</text>
  <text x="240" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#003f2d">stages</text>
  
  <!-- Step 3 -->
  <circle cx="360" cy="100" r="25" fill="#003f2d"/>
  <text x="360" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Step 3</text>
  <text x="360" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#003f2d">Timelines</text>
  
  <!-- Step 4 -->
  <circle cx="480" cy="100" r="25" fill="#003f2d"/>
  <text x="480" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Step 4</text>
  <text x="480" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#003f2d">Budget</text>
  
  <!-- House illustration -->
  <!-- Foundation -->
  <rect x="80" y="240" width="200" height="80" fill="#8B6F47" stroke="#003f2d" stroke-width="2"/>
  
  <!-- House body -->
  <rect x="100" y="180" width="160" height="70" fill="#D2691E" stroke="#003f2d" stroke-width="2"/>
  
  <!-- Roof -->
  <polygon points="100,180 180,120 260,180" fill="#8B4513" stroke="#003f2d" stroke-width="2"/>
  
  <!-- Insulation highlight (yellow) -->
  <polygon points="110,190 110,240 150,240 150,190" fill="#FFD700" opacity="0.7"/>
  <text x="130" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#003f2d">Insulation</text>
  
  <!-- Walls label -->
  <text x="75" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003f2d">Walls</text>
  <line x1="95" y1="205" x2="100" y2="205" stroke="#003f2d" stroke-width="1.5"/>
  
  <!-- Airtightness label -->
  <text x="50" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003f2d">Airtightness</text>
  <line x1="95" y1="245" x2="100" y2="245" stroke="#003f2d" stroke-width="1.5"/>
  
  <!-- Door -->
  <rect x="165" y="210" width="25" height="50" fill="#1A3A3A" stroke="#003f2d" stroke-width="1"/>
  
  <!-- Windows -->
  <rect x="130" y="195" width="20" height="20" fill="#87CEEB" stroke="#003f2d" stroke-width="1"/>
  <rect x="165" y="195" width="20" height="20" fill="#87CEEB" stroke="#003f2d" stroke-width="1"/>
  
  <!-- Trees -->
  <circle cx="40" cy="300" r="30" fill="#6BA55C"/>
  <circle cx="350" cy="320" r="35" fill="#6BA55C"/>
  
  <!-- Benefits section -->
  <!-- Checkmark 1 -->
  <circle cx="380" cy="220" r="20" fill="#00a86b"/>
  <text x="380" y="230" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" font-weight="bold">✓</text>
  <text x="410" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#003f2d">Sequenced</text>
  <text x="410" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#003f2d">upgrades</text>
  
  <!-- Checkmark 2 -->
  <circle cx="380" cy="270" r="20" fill="#00a86b"/>
  <text x="380" y="280" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" font-weight="bold">✓</text>
  <text x="410" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#003f2d">Aligned with</text>
  <text x="410" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#003f2d">BER & grants</text>
  
  <!-- Checkmark 3 -->
  <circle cx="380" cy="320" r="20" fill="#00a86b"/>
  <text x="380" y="330" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" font-weight="bold">✓</text>
  <text x="410" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#003f2d">Step-by-step</text>
  <text x="410" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#003f2d">plan</text>
</svg>
