<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a86b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="#f9f9f9"/>
  
  <!-- Step 1: Phone -->
  <circle cx="50" cy="80" r="25" fill="url(#grad2)"/>
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">📞</text>
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#003f2d">Book</text>
  
  <!-- Arrow -->
  <line x1="80" y1="80" x2="120" y2="80" stroke="#00a86b" stroke-width="2"/>
  <polygon points="120,80 110,75 110,85" fill="#00a86b"/>
  
  <!-- Step 2: Clipboard -->
  <circle cx="150" cy="80" r="25" fill="url(#grad2)"/>
  <text x="150" y="85" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">📋</text>
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#003f2d">Survey</text>
  
  <!-- Arrow -->
  <line x1="180" y1="80" x2="220" y2="80" stroke="#00a86b" stroke-width="2"/>
  <polygon points="220,80 210,75 210,85" fill="#00a86b"/>
  
  <!-- Step 3: Certificate -->
  <circle cx="250" cy="80" r="25" fill="url(#grad2)"/>
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">📄</text>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#003f2d">Report</text>
</svg>
