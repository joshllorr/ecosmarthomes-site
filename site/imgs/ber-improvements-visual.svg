<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a86b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="#f9f9f9"/>
  
  <!-- House silhouette -->
  <polygon points="150,40 100,80 100,160 200,160 200,80" fill="#e8f5e9" stroke="#00a86b" stroke-width="2"/>
  <polygon points="150,40 110,75 190,75" fill="#003f2d"/>
  
  <!-- Insulation upgrade (pink) -->
  <rect x="105" y="95" width="40" height="30" fill="#ff6b9d" opacity="0.8" rx="2"/>
  <text x="125" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">Insulation</text>
  
  <!-- Windows upgrade (light blue) -->
  <rect x="155" y="85" width="30" height="25" fill="#4db8ff" opacity="0.8" rx="2"/>
  <text x="170" y="102" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" font-weight="bold">Windows</text>
  
  <!-- Heating upgrade (orange) -->
  <rect x="105" y="135" width="35" height="20" fill="#ff9500" opacity="0.8" rx="2"/>
  <text x="122.5" y="148" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" font-weight="bold">Heating</text>
  
  <!-- Solar upgrade (yellow) -->
  <polygon points="165,55 175,55 170,45" fill="#ffd700" opacity="0.9"/>
  <text x="170" y="65" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#003f2d" font-weight="bold">Solar</text>
</svg>
