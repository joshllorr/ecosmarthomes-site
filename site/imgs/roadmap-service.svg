<svg width="400" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="serviceGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#serviceGrad4)"/>
  
  <!-- Timeline -->
  <line x1="40" y1="110" x2="360" y2="110" stroke="#003f2d" stroke-width="3"/>
  <polygon points="360,110 375,105 375,115" fill="#003f2d"/>
  
  <!-- Steps -->
  <circle cx="80" cy="110" r="20" fill="#00a86b"/>
  <text x="80" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <circle cx="160" cy="110" r="20" fill="#00a86b"/>
  <text x="160" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="240" cy="110" r="20" fill="#00a86b"/>
  <text x="240" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
  <circle cx="320" cy="110" r="20" fill="#00a86b"/>
  <text x="320" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
  
  <!-- Labels -->
  <text x="80" y="160" font-family="Arial" font-size="11" text-anchor="middle" fill="#003f2d" font-weight="bold">Assess</text>
  <text x="160" y="160" font-family="Arial" font-size="11" text-anchor="middle" fill="#003f2d" font-weight="bold">Plan</text>
  <text x="240" y="160" font-family="Arial" font-size="11" text-anchor="middle" fill="#003f2d" font-weight="bold">Upgrade</text>
  <text x="320" y="160" font-family="Arial" font-size="11" text-anchor="middle" fill="#003f2d" font-weight="bold">Success</text>
  
  <!-- House icon at start -->
  <polygon points="60,50 40,65 40,80 80,80 80,65" fill="#003f2d"/>
  <polygon points="40,65 60,45 80,65" fill="#8B4513"/>
</svg>
