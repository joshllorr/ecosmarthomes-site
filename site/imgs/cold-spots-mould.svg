<svg width="400" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="serviceGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c8e6c9" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#serviceGrad8)"/>
  
  <!-- House outline -->
  <polygon points="200,50 100,130 100,190 300,190 300,130" fill="none" stroke="#003f2d" stroke-width="3" opacity="0.5"/>
  
  <!-- Cold spots (blue circles) -->
  <circle cx="130" cy="145" r="20" fill="#4a90e2" opacity="0.6"/>
  <circle cx="270" cy="160" r="25" fill="#4a90e2" opacity="0.6"/>
  <circle cx="200" cy="130" r="15" fill="#4a90e2" opacity="0.6"/>
  <circle cx="150" cy="175" r="18" fill="#4a90e2" opacity="0.6"/>
  <circle cx="250" cy="140" r="22" fill="#4a90e2" opacity="0.6"/>
  
  <!-- Warning icons -->
  <g fill="#ff6b6b">
    <polygon points="130,138 126,146 134,146" />
    <polygon points="270,153 266,161 274,161" />
    <polygon points="150,168 146,176 154,176" />
    <polygon points="250,133 246,141 254,141" />
  </g>
  
  <!-- Magnifying glass with mould detection -->
  <circle cx="200" cy="160" r="40" fill="rgba(255,107,107,0.1)" stroke="#ff6b6b" stroke-width="4"/>
  <line x1="235" y1="195" x2="270" y2="230" stroke="#003f2d" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Alert symbol -->
  <circle cx="200" cy="160" r="15" fill="#ff6b6b"/>
  <text x="200" y="168" font-family="Arial" font-size="20" text-anchor="middle" fill="white" font-weight="bold">!</text>
</svg>