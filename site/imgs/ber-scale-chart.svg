<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a86b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="#f9f9f9"/>
  
  <!-- Scale bars -->
  <g transform="translate(50, 50)">
    <!-- A (Best) -->
    <rect x="0" y="0" width="35" height="80" fill="#00a86b" rx="3"/>
    <text x="17.5" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#003f2d">A</text>
    
    <!-- B -->
    <rect x="40" y="10" width="35" height="70" fill="#5fb878" rx="3"/>
    <text x="57.5" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#003f2d">B</text>
    
    <!-- C -->
    <rect x="80" y="20" width="35" height="60" fill="#a4d65e" rx="3"/>
    <text x="97.5" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#003f2d">C</text>
    
    <!-- D -->
    <rect x="120" y="30" width="35" height="50" fill="#ffd700" rx="3"/>
    <text x="137.5" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#003f2d">D</text>
    
    <!-- E -->
    <rect x="160" y="40" width="35" height="40" fill="#ff9500" rx="3"/>
    <text x="177.5" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">E</text>
    
    <!-- F -->
    <rect x="200" y="50" width="35" height="30" fill="#ff6b6b" rx="3"/>
    <text x="217.5" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">F</text>
  </g>
</svg>
