<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#003f2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background rectangle (optional, for standalone use) -->
  <!-- <rect width="400" height="100" fill="#ffffff"/> -->
  
  <!-- House icon -->
  <g transform="translate(20, 30)" filter="url(#shadow)">
    <polygon points="35,10 10,40 10,55 60,55 60,40" fill="url(#logoGrad)"/>
    <polygon points="10,40 35,15 60,40" fill="#003f2d" opacity="0.4"/>
    <rect x="30" y="40" width="8" height="12" fill="white" opacity="0.85"/>
  </g>
  
  <!-- Leaf accent -->
  <path d="M90 35 Q85 45 75 50 Q85 45 90 40" fill="#00a86b" opacity="0.8"/>
  <path d="M95 30 Q90 40 80 45 Q90 40 95 35" fill="#00a86b" opacity="0.6"/>
  
  <!-- Main text -->
  <text x="110" y="62" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#logoGrad)">EcoSmart</text>
  <text x="280" y="62" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#003f2d">Home</text>
  
  <!-- Tagline -->
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="14" fill="#666" font-style="italic">Independent. Smart. Sustainable.</text>
</svg>