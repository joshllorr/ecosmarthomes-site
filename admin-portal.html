<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Access</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% -10%, #004d38 0%, #00241b 60%, #001711 100%);
        font-family: Arial, sans-serif;
        color: #fff;
      }

      .panel {
        width: min(92vw, 420px);
        background: rgba(0, 36, 27, 0.85);
        border: 1px solid rgba(52, 245, 197, 0.3);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 18px;
        color: rgba(255,255,255,0.75);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 1rem;
        margin-bottom: 14px;
      }

      input::placeholder {
        color: rgba(255,255,255,0.5);
      }

      button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: #14b8a6;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #0d9488;
      }

      .error {
        color: #fecaca;
        min-height: 20px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Admin Access</h1>
      <p>This area is protected by Cloudflare Access or a real identity provider.</p>
      <p>Sign in through your approved identity flow, then open the dashboard.</p>

      <button id="enterBtn" type="button">Open Dashboard</button>
      <div id="error" class="error"></div>
    </div>

    <script>
      document.getElementById('enterBtn').addEventListener('click', () => {
        window.location.href = 'ecosmarthomes-api/admin.html';
      });
    </script>
  </body>
</html>
