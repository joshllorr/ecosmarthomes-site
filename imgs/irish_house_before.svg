<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="pebbledash" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#d1c7b7"/>
      <circle cx="3" cy="4" r="1.5" fill="#a89b88"/>
      <circle cx="11" cy="9" r="2" fill="#8c7e6b"/>
      <circle cx="7" cy="14" r="1.2" fill="#beaf9c"/>
      <circle cx="14" cy="3" r="1.8" fill="#7a6d5c"/>
    </pattern>
    <linearGradient id="doorRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyBefore)"/>

  <!-- Ground / Driveway -->
  <rect y="450" width="1200" height="225" fill="#64748b"/>
  <polygon points="150,675 350,450 750,450 950,675" fill="#94a3b8"/>
  <!-- Driveway Cracks -->
  <path d="M 400 500 L 450 560 L 420 620" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 600 480 L 580 540 L 630 650" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Main House Structure (1980s Pebbledash Semi-D) -->
  <rect x="360" y="140" width="480" height="310" fill="url(#pebbledash)" stroke="#78716c" stroke-width="3"/>
  <line x1="600" y1="140" x2="600" y2="450" stroke="#57534e" stroke-width="3"/>

  <!-- Roof & Chimney -->
  <polygon points="340,140 600,40 860,140" fill="#44403c"/>
  <polygon points="860,140 600,40 1100,140" fill="#292524" opacity="0.6"/>
  <rect x="740" y="45" width="45" height="65" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <rect x="735" y="40" width="55" height="10" fill="#92400e"/>

  <!-- 1980s Windows (White PVC) -->
  <!-- Upper Left -->
  <rect x="420" y="180" width="110" height="85" fill="#e2e8f0" stroke="#ffffff" stroke-width="6" rx="2"/>
  <rect x="426" y="186" width="98" height="73" fill="#cbd5e1" opacity="0.7"/>
  <line x1="475" y1="186" x2="475" y2="259" stroke="#ffffff" stroke-width="4"/>

  <!-- Upper Right -->
  <rect x="630" y="180" width="130" height="85" fill="#e2e8f0" stroke="#ffffff" stroke-width="6" rx="2"/>
  <rect x="636" y="186" width="118" height="73" fill="#cbd5e1" opacity="0.7"/>
  <line x1="710" y1="186" x2="710" y2="259" stroke="#ffffff" stroke-width="4"/>

  <!-- Ground Right Window -->
  <rect x="630" y="300" width="130" height="95" fill="#e2e8f0" stroke="#ffffff" stroke-width="6" rx="2"/>
  <rect x="636" y="306" width="118" height="83" fill="#94a3b8" opacity="0.6"/>
  <line x1="710" y1="306" x2="710" y2="389" stroke="#ffffff" stroke-width="4"/>

  <!-- Ground Door (Traditional Red Wood) -->
  <rect x="430" y="295" width="90" height="155" fill="url(#doorRed)" stroke="#450a0a" stroke-width="4"/>
  <rect x="445" y="310" width="60" height="50" fill="#fef2f2" opacity="0.4" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="505" cy="380" r="4" fill="#fbbf24"/>

  <!-- Garden & Red Hatchback Car -->
  <rect x="150" y="520" width="180" height="120" rx="15" fill="#dc2626"/>
  <rect x="180" y="530" width="100" height="40" rx="10" fill="#94a3b8"/>
  <circle cx="190" cy="640" r="22" fill="#1e293b"/>
  <circle cx="290" cy="640" r="22" fill="#1e293b"/>

  <!-- Technical Telemetry Overlay -->
  <rect x="30" y="30" width="260" height="75" rx="8" fill="rgba(15,23,42,0.85)" stroke="#ef4444" stroke-width="2"/>
  <text x="50" y="58" font-family="monospace" font-weight="bold" font-size="16" fill="#f87171">BEFORE RETROFIT</text>
  <text x="50" y="82" font-family="sans-serif" font-size="14" fill="#e2e8f0">BER D2 · U-Value 2.10 W/m²K</text>
</svg>
